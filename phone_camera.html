<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inquisitor phone camera</title>
    <style>
      body { margin: 0; padding: 24px; background: #080e1b; color: #e3edff; font: 16px system-ui, sans-serif; }
      main { max-width: 640px; margin: auto; }
      video { width: 100%; margin: 20px 0; border-radius: 12px; background: #030812; }
      button, select { padding: 12px; border-radius: 8px; font: inherit; }
      button { background: #267ae5; color: white; border: 0; }
      button:disabled { opacity: .5; }
      #status { min-height: 3em; }
    </style>
  </head>
  <body>
    <main>
      <h1>Inquisitor</h1>
      <p>Share your phone camera with the control room. Keep this page open and your screen awake.</p>
      <label>Camera <select id="camera"><option value="environment">Rear camera</option><option value="user">Front camera</option></select></label>
      <video id="video" autoplay muted playsinline></video>
      <button id="start">Connect camera</button>
      <button id="stop" disabled>Stop camera</button>
      <p id="status">Tap Connect camera and allow camera access.</p>
    </main>
    <script>
      const token = location.hash.slice(1);
      const video = document.getElementById("video");
      const start = document.getElementById("start");
      const stop = document.getElementById("stop");
      const camera = document.getElementById("camera");
      const status = document.getElementById("status");
      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");
      let stream, running = false, wakeLock, generation = 0;

      async function stopCamera() {
        running = false;
        generation++;
        if (stream) stream.getTracks().forEach(track => track.stop());
        stream = null;
        video.srcObject = null;
        if (wakeLock) await wakeLock.release().catch(() => {});
        wakeLock = null;
        start.disabled = false;
        stop.disabled = true;
        camera.disabled = false;
      }

      async function sendFrames(currentGeneration) {
        while (running && currentGeneration === generation) {
          try {
            if (!video.videoWidth) {
              await new Promise(resolve => setTimeout(resolve, 100));
              continue;
            }
            const scale = Math.min(1, 1280 / video.videoWidth, 720 / video.videoHeight);
            canvas.width = Math.round(video.videoWidth * scale);
            canvas.height = Math.round(video.videoHeight * scale);
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const frame = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.75));
            if (!running || currentGeneration !== generation) break;
            if (!frame) throw new Error("Unable to capture camera frame.");
            const response = await fetch("/frame?token=" + encodeURIComponent(token), {
              method: "POST", headers: { "Content-Type": "image/jpeg" }, body: frame,
              signal: AbortSignal.timeout(5000),
            });
            if (!running || currentGeneration !== generation) break;
            if (response.status === 403) {
              await stopCamera();
              status.textContent = "This connection has expired or was disconnected. Scan a new QR code in Inquisitor.";
              break;
            }
            if (!response.ok) throw new Error("Unable to send camera frame.");
            status.textContent = "Connected. Your camera is live in Inquisitor.";
          } catch (error) {
            if (running && currentGeneration === generation) status.textContent = "Connection interrupted. Retrying...";
          }
          await new Promise(resolve => setTimeout(resolve, 200));
        }
      }

      start.onclick = async () => {
        if (!token) { status.textContent = "Scan the QR code from Inquisitor to connect."; return; }
        if (!navigator.mediaDevices?.getUserMedia) {
          status.textContent = "Camera access needs a trusted HTTPS connection. Trust the Inquisitor certificate on this phone, then reopen the link in Safari or Chrome.";
          return;
        }
        start.disabled = true;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: {
            facingMode: { ideal: camera.value }, width: { ideal: 1280 }, height: { ideal: 720 },
          }});
          video.srcObject = stream;
          await video.play();
          running = true;
          camera.disabled = true;
          stop.disabled = false;
          if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen").catch(() => null);
          status.textContent = "Connecting to Inquisitor...";
          sendFrames(++generation);
        } catch (error) {
          await stopCamera();
          status.textContent = "Camera could not start. Allow camera permission and check that this page has a trusted HTTPS connection.";
        }
      };
      stop.onclick = async () => { await stopCamera(); status.textContent = "Camera stopped."; };
      window.addEventListener("pagehide", () => { running = false; if (stream) stream.getTracks().forEach(track => track.stop()); });
    </script>
  </body>
</html>
